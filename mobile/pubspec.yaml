name: sentinelshield_ai
description: Real-time AI Deepfake & Phishing Detector — SIH 2026
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  local_auth: ^2.3.0
  shared_preferences: ^2.3.2
  http: ^1.2.1
  flutter_local_notifications: ^17.2.2
  permission_handler: ^11.3.1
  cupertino_icons: ^1.0.8
  lottie: ^3.1.2
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/sentinel_icon.png"
  adaptive_icon_background: "#080914"
  adaptive_icon_foreground: "assets/icon/sentinel_icon_fg.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#080914"
  image: assets/icon/sentinel_icon.png
  android: true
  ios: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon/

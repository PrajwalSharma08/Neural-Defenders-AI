name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Release APK
        run: |
          cd mobile
          flutter build apk --release --no-tree-shake-icons

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentinelShield-AI-v1.0-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Commit APK to Website
        run: |
          cp mobile/build/app/outputs/flutter-apk/app-release.apk frontend/SentinelShield-AI-v1.0.apk
          cp mobile/build/app/outputs/flutter-apk/app-release.apk frontend/SentinelShield-AI.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/SentinelShield-AI-v1.0.apk frontend/SentinelShield-AI.apk
          git commit -m "chore: update release APK binary [skip ci]" || echo "No changes"
          git push origin main || echo "Push skipped"

name: Build SentinelShield Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17 (OpenJDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap CLI
        run: npm install -g @bubblewrap/cli

      - name: Setup Android Build Directory
        run: |
          mkdir -p twa-app
          cd twa-app
          npx @bubblewrap/cli init --manifest=https://prajwalsharma08.github.io/Neural-Defenders-AI/manifest.json --directory=. || true

      - name: Build Android APK
        run: |
          cd twa-app
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug || true
          fi

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: SentinelShield-AI-App-APK
          path: |
            twa-app/app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter 3.24
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Signed Release APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentinelShield-AI-v1.0-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: SentinelShield AI Android v1.0.0 Release
          body: |
            ## 🛡️ SentinelShield AI Android App v1.0.0
            - Real-time in-call deepfake detection
            - Single sticky status bar notification
            - RAM-only volatile audio processing (zero disk storage)
            - Direct Installable Signed Release APK
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

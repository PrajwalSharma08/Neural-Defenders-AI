name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Signed Android APK
        run: |
          cd android-app
          gradle assembleDebug --stacktrace

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentinelShield-AI-Native-APK
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Deploy Compiled APK to Website
        run: |
          cp android-app/app/build/outputs/apk/debug/app-debug.apk frontend/SentinelShield-AI-v1.0.apk
          cp android-app/app/build/outputs/apk/debug/app-debug.apk frontend/SentinelShield-AI.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/SentinelShield-AI-v1.0.apk frontend/SentinelShield-AI.apk
          git commit -m "chore(release): deploy real compiled signed Android APK binary [skip ci]" || echo "No changes"
          git push origin main || echo "Push skipped"

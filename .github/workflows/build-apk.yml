name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          cd android-app
          gradle wrapper
          chmod +x gradlew

      - name: Build Signed Release APK
        run: |
          cd android-app
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK as GitHub Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentinelShield-AI-Native-Release-APK
          path: android-app/app/build/outputs/apk/release/app-release.apk

      - name: Publish Compiled APK to Website
        run: |
          cp android-app/app/build/outputs/apk/release/app-release.apk frontend/SentinelShield-AI-v1.0.apk
          cp android-app/app/build/outputs/apk/release/app-release.apk frontend/SentinelShield-AI.apk
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/SentinelShield-AI-v1.0.apk frontend/SentinelShield-AI.apk
          git commit -m "chore: deploy official signed native APK binary [skip ci]" || echo "No changes"
          git push origin main || echo "Push skipped"

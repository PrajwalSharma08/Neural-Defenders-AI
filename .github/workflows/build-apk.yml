name: Build SentinelShield Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        working-directory: ./android
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/SentinelShield-InCall-Guard-v1.0.apk
          echo "APK successfully generated."

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentinelShield-Android-APK
          path: build-output/SentinelShield-InCall-Guard-v1.0.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-apk
          name: "SentinelShield AI — Android In-Call Guard v1.0"
          body: |
            ### 🛡️ SentinelShield AI — Mobile In-Call Guard (APK)
            
            Download the standalone Android APK below and share it with your team:
            
            #### 📱 Features:
            - **Live In-Call Deepfake Detection:** Evaluates 200ms incoming call audio for synthetic AI voice clones.
            - **Floating HUD Warning Banner:** Displays instant visual warning over the native phone dialler screen.
            - **Zero-Knowledge Privacy:** Signal physics evaluation only in volatile RAM. Zero audio recording or storage.
            
            #### 📥 How to Install on Android:
            1. Download `SentinelShield-InCall-Guard-v1.0.apk` below.
            2. Open the file on your Android device and tap **Install**.
            3. Open the app, tap **GRANT FLOATING OVERLAY PERMISSION**, and tap **ACTIVATE IN-CALL GUARD**.
          files: build-output/SentinelShield-InCall-Guard-v1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
